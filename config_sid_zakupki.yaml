# SID — synthetic dataset factory for agentic retrieval (plan v0.8, first version)
#
#   python run_sid.py all --config config_sid.yaml
#   python run_sid.py all --config config_sid.yaml --backend mock \
#       --corpus tests/sample_corpus_sid.jsonl --out-dir out_sid_demo

corpus_name: ckr
language: ru
taxonomy_version: v0.8
log_level: INFO

# _CORE_FIELDS = {"file_name", "index", "raw_text", "document_id", "title"}
paths:
  corpus: data/zakupki/zakupki_tiny.jsonl        # v0 index: {"file_name","index","raw_text",...}
  meta: "data/zakupki/zakupki_tiny_meta.jsonl"                         # optional per-chunk metadata sidecar (chunk_id-keyed
                                    # JSONL); merged into Chunk.meta, see mining.scope_field
  out_dir: out_sid

# ---------------------------------------------------------------------------
# Models. Generator and judge may differ — a stronger judge reduces self-bias.
# ---------------------------------------------------------------------------
llm:
  backend: gateway
  base_url: https://sm.apps.dev-terra000003-ids.ocp.delta.sbrf.ru/qwen_35
  cert_file: gigachat/published.pem
  key_file: gigachat/00CA0001CLLMllm99usr.key
  verify_ssl: false
  temperature: 0.7                 # composition wants variety
  max_tokens: 1536
  max_concurrency: 4
  extra_body:
    top_p: 0.90
    reasoning: false
    chat_template_kwargs:
      enable_thinking: false

judge:
  backend: gateway
  base_url: https://sm.apps.dev-terra000003-ids.ocp.delta.sbrf.ru/qwen_35
  cert_file: gigachat/published.pem
  key_file: gigachat/00CA0001CLLMllm99usr.key
  verify_ssl: false
  temperature: 0.1                 # judging wants determinism
  max_tokens: 1024
  max_concurrency: 4
  extra_body:
    reasoning: false
    chat_template_kwargs:
      enable_thinking: false

# Dense branch of the hybrid retriever. This must be the SAME embedder the agent
# uses at rollout time — the gates measure against this environment.
embed:
  backend: gigachat                # gigachat | mock
  model: GigaEmbeddings-3B-2025-09
  base_url: https://gigachat-ift.sberdevices.delta.sbrf.ru/v1/embeddings
  cert_file: gigachat/published.pem
  key_file: gigachat/00CA0001CLLMllm99usr.key
  verify_ssl: false
  batch_size: 16
  max_input_chars: 7000
  max_concurrency: 2
  min_request_interval: 0.0

rrf_k: 60                          # RRF constant of the hybrid fusion
fusion_candidates: 100             # per-branch depth before fusion

# Seed-chunk eligibility (junk stays in the index but is never gold)
filters:
  min_chars: 200
  max_chars: 4000
  min_words: 25
  min_alpha_ratio: 0.5
  min_cyrillic_ratio: 0.3

# --- Facets (arqg/sid/scoping.py: facet_header, arqg/sid/env.py: passage_text)
# Which per-chunk metadata is *surfaced*, and where. `meta_fields` in
# index_fields.yaml (after `run_sid.py compat`) lists what this corpus carries.
#
# Why it matters here more than anywhere: a ЕИС notice is not distinguished from
# ten thousand notices of the same template by its prose — it is distinguished
# by its region, customer and ОКПД2 code. Without them in the passage a fact
# paraphrased with the customer's name cannot retrieve its own chunk, so G_REACH
# rejects a task the environment could actually serve; without them in the
# prompts the composer writes questions that fit any notice at all.
#
# Keep the two switches together. Prompts-only is the harmful half (the composer
# names attributes no passage carries) — `SidConfig` warns about it.
facets:
  fields:                          # rendered in this order
    - region
    - customer
    - okpd2_code
    - law
    - procedure                    # способ: аукцион / конкурс / … (empty on most XML chunks)
    - year
    - price_bucket
    - section                      # which part of the notice; the only field that varies per chunk
    - winner                       # sparse (~2%); facet_header skips empty values
  in_passage: true                 # BM25 + dense hold the same string
  in_prompts: true                 # facts / compose / G_SOLVE / G_REP see it
  labels:                          # header labels; the key itself is the default
    region: Регион
    customer: Заказчик
    okpd2_code: ОКПД2
    law: Закон
    procedure: Способ
    year: Год
    price_bucket: НМЦК
    section: Раздел
    winner: Победитель
  max_value_chars: 120             # a customer's full legal name is long
  # meta_fields left out of the header (still usable as mining.scope_field):
  #   purchase_number / document_id — unique, G_REACH would match the id
  #   region_code — same information as region
  #   price_start / published — raw forms of price_bucket / year
  #   customer_inn / phase — sparse identifiers, not query vocabulary
  #   source_url / datasets / n_chars — provenance and length, not facets

# --- S1 --------------------------------------------------------------------
mining:
  idf_percentile: 75               # τ_idf — start of the plan's calibration
  max_document_frequency: 40       # τ_df
  min_co_occurrence: 2
  min_chunks: 2
  max_chunks: 4
  max_subgraphs_per_entity: 2
  max_subgraphs_per_file: 6
  target_subgraphs: 2000           # 0 = unlimited
  cross_document_bonus: true
  # Scope selection (arqg/sid/scoping.py): mine within a group of chunks that
  # share one field's value instead of over the whole corpus. `scope_field` is
  # a builtin chunk attribute (title/document_id/file_name) or a key in a
  # chunk's metadata (see paths.meta below, and index_fields.yaml's
  # meta_fields after `run_sid.py compat`). `scope_strategy: path` reads it as
  # a `/`-separated breadcrumb and groups by folder (this corpus's `title`);
  # `exact` groups chunks sharing the value verbatim — the shape for a flat
  # categorical facet (zakupki's region/customer/okpd2_code/...).
  scope_field: okpd2_code
  scope_strategy: exact             # path | exact
  path_scope_gap: 1                # "path" only: 0 = same folder, 1 = one level up, null = off
  scope_df_ratio: 0.5              # above this share of a folder = its subject
  max_subgraphs_per_path: 8
  max_bridge_type_share: 0.5
  same_doc_min_chunks: 20          # same-document pairs need a navigable document
  min_index_gap: 8                 # ... and a real gap between the chunks

  # Second bridge channel. The entity channel reaches 283 of this corpus's 800
  # folders; in 451 of the other 517 no surface form repeats at all, so they are
  # invisible to exact matching rather than filtered out by a threshold. Pairs
  # in the band 0.50-0.90 exist in 601 folders. See arqg/sid/simbridge.py.
  sim_bridge: true
  sim_bridge_low_percentile: 95    # p95 ~ 0.51 here: related above background
  # Measured on the first run: with the partner inside the top-3 neighbours
  # G_BROAD passed 0.22 of the time and 0.13 became tasks, against 0.55 / 0.30
  # beyond rank 50 — one query already returns both, which is a trivial task.
  sim_bridge_exclude_top_k: 3
  sim_bridge_max_pairs_per_scope: 8

# --- S2 --------------------------------------------------------------------
taxonomy:
  mechanics: []                    # [] = all six A1 values
  negation_rate: 0.20              # plan wants >= 15% of tasks with negation
  candidates_per_cell: 3           # 1-of-N local diversity (plan says 6)
  keep_per_batch: 1
  # How the batch's survivor is chosen. `hardest` keeps the largest fused_gap,
  # which starves the "low" bin the export grades the pool against; `datamix`
  # keeps the member whose bin is furthest below export.target_fused_gap_share.
  batch_selection: datamix          # datamix | hardest

# --- S3 --------------------------------------------------------------------
compose:
  max_facts_per_chunk: 4
  min_facts_per_question: 2
  max_facts_per_question: 5
  max_compose_iters: 2
  verbatim_match: true             # drop facts whose span is not in the chunk

# --- S4 / S5 ---------------------------------------------------------------
gates:
  top_k: 10
  run_broad: true
  run_reach: true
  # What G_REACH probes with. The fact's verbatim span is an exact substring of
  # the chunk it has to retrieve, so probing with it measures BM25 self-recall,
  # not the environment's ceiling. `paraphrase` uses fact_normalized — the
  # closest thing to a query the agent could actually form.
  reach_probe: paraphrase          # paraphrase | verbatim | both
  dual_critic: false               # pilot only; measures disagreement_rate
  drop_on_disagreement: true
  run_min: true
  min_facts_after_min: 2
  run_rep: true
  rep_top_k: 8
  rep_max_judges_per_fact: 5
  rep_min_score: 0.55

# --- §7.1 ------------------------------------------------------------------
density:
  tau_sim_percentile: 95           # intra-corpus percentile, never absolute
  tau_low_percentile: 80
  sample_chunks: 600
  pseudo_gold_sets: 2000
  min_reach_tasks_for_median: 300  # below this the provisional median is used

# --- §7.2-7.6 --------------------------------------------------------------
distractors:
  enabled: true
  n_max: 15
  low_threshold_ratio: 0.34        # below this fraction of the median: sparse_origin
  min_l2: 2                        # >= 2 L2 (near-miss) distractors per task
  l1_pool: 40
  l2_pool: 20
  allow_l3: true                   # fallback only; share_L3 > 10% is an alarm
  max_candidates_per_task: 24
  require_l2_attribute_in_question: true
  require_neighborhood_hit: true   # sim(d, gold) > τ_sim or the budget is wasted
  reach_recheck_sample: 500

# --- S7 --------------------------------------------------------------------
isolation:
  enabled: true
  top_k: 10
  judge_top_n: 4
  judge_alternative_paths: true

# --- S8 --------------------------------------------------------------------
# train / holdout only; the SFT/RL split waits for a trainer to split it for
export:
  holdout_size: 300
  dedup_threshold: 0.8
  fused_gap_bins:
    low: 0.33
    mid: 0.66
