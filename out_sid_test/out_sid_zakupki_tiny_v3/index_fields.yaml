  - section
  - winner
  in_passage: true
  in_prompts: true
  missing_on_this_corpus: []
  example: 'Регион: Челябинская область | Заказчик: АО «Челябинский Метротрамвай»
    | Закон: 223-ФЗ | Способ: Закупка иного способа размещения | Год: 2022 | НМЦК:
    свыше 1 млрд руб. | Раздел: Общие сведения о закупке'
notes:
- date / ACL / doc_type tags are not present in this corpus; temporal_resolution therefore
  relies on dates extracted from text.
- 'title is a path, not a headline: it is the section anchor S1 scopes on by default
  (mining.scope_field=title, scope_strategy=path — see scoping.py). It is NOT registered
  as an entity-graph tag — that would bypass tau_idf and make every folder sibling
  a bridge.'
- additional per-chunk facets are available (see meta_fields above) — point mining.scope_field
  at one of them with scope_strategy=exact to mine within chunks that share its value
  verbatim (a categorical facet, not a path), instead of the title breadcrumb.
- 'a facet only reaches the retriever if `facets.fields` lists it: grouping chunks
  by a field the index cannot see gives the composer an attribute to name and the
  probe nothing to match it against.'
