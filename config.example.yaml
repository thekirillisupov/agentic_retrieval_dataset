# ─────────────────────────────────────────────────────────────────────────────
# Agentic-retrieval dataset pipeline — example configuration
#
# Two supported setups for the generator/judge LLM. Both use the SAME settings
# block; only base_url / model / api key differ:
#
#  (A) HOSTED API you already have (OpenAI-compatible — OpenAI, Together, DeepSeek,
#      OpenRouter, Mistral, a corporate gateway, etc.):
#        backend: openai
#        base_url: https://api.your-provider.com/v1
#        model:    <provider model id>
#        api_key_env: OPENAI_API_KEY          # export the key in this env var
#
#  (B) SELF-HOSTED vLLM (you run it separately — see scripts/serve_vllm.sh):
#        backend: openai                      # vLLM speaks the OpenAI API
#        base_url: http://localhost:8000/v1
#        model:    Qwen/Qwen2.5-72B-Instruct  # must match what vLLM is serving
#        api_key_env: OPENAI_API_KEY          # any value; vLLM ignores it
#
#  (C) Native Anthropic:
#        backend: anthropic
#        model:   <anthropic model id>
#        api_key_env: ANTHROPIC_API_KEY
#
#  (D) Corporate gateway (mTLS curl-style — NOT OpenAI SDK):
#        backend: gateway
#        base_url: https://sm.apps.example.ru/qwen_35   # full POST URL
#        cert_file: published.pem
#        key_file:  client.key
#        verify_ssl: false
#        temperature: 0.1
#        max_tokens: 1536
#        extra_body:
#          top_p: 0.95
#          reasoning: false
#          chat_template_kwargs:
#            enable_thinking: false
# ─────────────────────────────────────────────────────────────────────────────

log_level: INFO

paths:
  chunks: data/chunks.jsonl     # {"file_name","index","raw_text"} per line (or .json / a dir)
  out_dir: out

# Generator LLM -----------------------------------------------------------------
llm:
  backend: openai
  model: Qwen/Qwen2.5-72B-Instruct
  base_url: http://localhost:8000/v1
  api_key_env: OPENAI_API_KEY
  temperature: 0.5              # a little diversity helps question variety
  max_tokens: 1536
  max_concurrency: 16           # in-flight requests; raise for throughput
  max_retries: 5
  request_timeout: 120

# Seed-chunk eligibility (junk chunks stay as neighbours, just never seed/gold) --
filters:
  min_chars: 200
  max_chars: 4000
  min_words: 25
  min_alpha_ratio: 0.5
  min_cyrillic_ratio: 0.3

# Neighbour windows -------------------------------------------------------------
windows:
  window_sizes: [2, 3, 4]
  window_size_weights: [0.5, 0.35, 0.15]
  max_window_chars: 9000
  max_windows_per_file: 6       # keep large documents from dominating
  target_windows: 5000          # total windows to build (0 = all eligible)
  stride: 1
  seed: 13

# Generation process #1 — neighbour-window multi-hop questions ------------------
generate:
  enabled: true                  # set false to skip this generator entirely
  questions_per_window: 1
  require_multi_chunk: true
  min_gold_chunks: 2            # final dataset requires >= this many gold chunks
  # Question style mix — mimics real user phrasing (see arqg/prompts.py STYLES).
  # One style is sampled per question (deterministic) and recorded in the item.
  #   simple_user  — short, colloquial, like a support-chat / search-bar question
  #   novice       — no domain terminology, describes things in everyday words
  #   expert       — precise domain phrasing
  #   search_query — 3-8 word search-bar query, possibly not a full sentence
  styles:
    simple_user: 0.45
    novice: 0.20
    expert: 0.20
    search_query: 0.15
  style_seed: 17

# Generation process #2 — document-level simple / hard questions ----------------
# Separate, independently-switchable generator. Works over a WHOLE document and
# has NO limit on the number of anchor passages:
#   simple → answer fully contained in ONE passage              (gold = 1)
#   hard   → answer requires combining MANY passages in the doc (gold >= 2, no cap)
# Output format is identical (keeps gold_chunk_ids); it shares the verify stage.
# Run alongside #1 (both feed candidates.jsonl) or on its own:
#   set generate.enabled: false and docgen.enabled: true, then `all`,
#   or run stages explicitly: docunits -> gen-docs -> verify -> finalize
docgen:
  enabled: false
  questions_per_unit: 1
  difficulty_weights:            # sampled per document unit
    simple: 0.5
    hard: 0.5
  simple_max_gold: 1             # passages a "simple" question may rest on
  hard_min_gold: 2              # minimum anchors for a "hard" question
  hard_max_gold: 0             # 0 = unlimited anchor passages
  styles:                        # same user-phrasing styles as generator #1
    simple_user: 0.45
    novice: 0.20
    expert: 0.20
    search_query: 0.15
  style_seed: 29
  units:
    max_doc_chars: 30000         # huge documents are split into spans this big
    max_doc_chunks: 40
    min_unit_chunks: 1
    max_units_per_file: 4
    target_units: 2000           # total document units to build (0 = all)
    seed: 23

# Verification (the quality gate) -----------------------------------------------
verify:
  enabled: true
  run_groundedness: true
  run_minimality: true
  drop_if_single_chunk_sufficient: true
  require_standalone: true
  require_specific: true
  # The judge can be a DIFFERENT (often stronger) model than the generator.
  # Using a separate model reduces self-bias and improves filtering quality.
  judge:
    backend: openai
    model: Qwen/Qwen2.5-72B-Instruct
    base_url: http://localhost:8000/v1
    api_key_env: OPENAI_API_KEY
    temperature: 0.0           # deterministic judging
    max_tokens: 1024
    max_concurrency: 16

# Collect-all-positives (final validation; needs an external retrieval round) ---
# When enabled, `all` stops after `verify`: it decomposes each question into
# atomic clues and writes out/retrieval_requests.jsonl. You retrieve top_k
# passages per clue across the whole corpus, save out/retrieval_results.jsonl
# (see README for the format), then run:  collect-positives  ->  finalize.
# An entailment judge keeps every passage that truly states the clue's fact, so
# near-duplicate sources of the same fact are added to positive_chunk_ids.
collect:
  enabled: false
  top_k: 20                      # passages you return per clue
  require_original_gold: true    # original gold always counts as a positive
  max_positives_per_clue: 0      # 0 = unlimited
  judge:                         # entailment judge (clue generation uses `llm`)
    backend: openai
    model: Qwen/Qwen2.5-72B-Instruct
    base_url: http://localhost:8000/v1
    api_key_env: OPENAI_API_KEY
    temperature: 0.0
    max_tokens: 512
    max_concurrency: 16

# Retrieval — embed the corpus, index it, fill the collect round automatically -
# Corpus records may carry {raw_text, document_id, title, file_name, index}.
# With retrieve.enabled, `all` runs clues -> retrieve -> collect-positives end to
# end (no manual passage round). Disable to return passages yourself instead.
retrieve:
  enabled: true
  backend: gigachat               # "gigachat" | "mock"
  model: GigaEmbeddings-3B-2025-09
  base_url: https://gigachat.devices.sberbank.ru/api/v1/embeddings
  # Auth — provide ONE of:
  token_env: GIGACHAT_TOKEN       # a static "Bearer" access token, OR
  auth_key_env: GIGACHAT_AUTH_KEY # base64(client_id:secret) -> OAuth (auto-refreshed)
  oauth_url: https://ngw.devices.sberbank.ru:9443/api/v2/oauth
  scope: GIGACHAT_API_PERS
  verify_ssl: true                # set false, or point ca_bundle at the Russian CA
  ca_bundle: ""                   # e.g. russian_trusted_root_ca.pem
  embed_with_title: true          # prepend each passage's title before embedding
  batch_size: 32
  max_concurrency: 8
  top_k: 0                        # 0 = use collect.top_k
  index_dir: ""                   # default <out_dir>/index ; cached & reused
  rebuild_index: false

# Hard-negative mining (optional; needs sentence-transformers + torch) ----------
negatives:
  enabled: false
  embedding_model: intfloat/multilingual-e5-large
  top_k: 5
  exclude_same_file: false
  device: cpu                  # set to "cuda" if a GPU is available
  batch_size: 64
